server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must match spring.servlet.multipart.max-request-size (15 MB).
    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to the Spring Boot service.
    location /api/ {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        # Keep the port in the Host header. Spring's CORS check compares the
        # Origin against scheme://Host, so stripping ":8080" made requests from
        # http://127.0.0.1:8080 look cross-origin and rejected them with 403.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append: clients must not be able to spoof their
        # rate-limit identity with a crafted X-Forwarded-For header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA entry must never be heuristically cached by browsers: a stale
    # shell keeps shipping an old bundle even after a rebuild, which looks
    # like "the fix did not deploy". This covers both / and /index.html.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service worker updates are byte-compared on navigation; keep it fresh.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
