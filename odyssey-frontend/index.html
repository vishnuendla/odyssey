<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odyssey · Travel journals, maps and stories</title>
    <link rel="icon" href="/assets/globe-icon.png" type="image/png" />
    <meta
      name="description"
      content="Odyssey is a travel journaling platform. Write rich journal entries with photos and places, browse other travellers' stories, and see every journey on an interactive map."
    />
    <meta name="theme-color" content="#0f766e" />
    <link rel="canonical" href="https://odyssey.app/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Open Graph / social previews. Journal pages override these tags at runtime. -->
    <meta property="og:site_name" content="Odyssey" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Odyssey · Travel journals, maps and stories" />
    <meta
      property="og:description"
      content="Document your trips with photos, places and stories. Explore public travel journals from around the world."
    />
    <meta property="og:url" content="https://odyssey.app/" />
    <meta property="og:image" content="/assets/globe-icon.png" />
    <meta property="og:image:alt" content="Odyssey travel journaling" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Odyssey · Travel journals, maps and stories" />
    <meta
      name="twitter:description"
      content="Document your trips with photos, places and stories. Explore public travel journals from around the world."
    />
    <meta name="twitter:image" content="/assets/globe-icon.png" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      (function () {
        try {
          var theme = localStorage.getItem('odyssey-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
