spring.datasource.url=jdbc:h2:mem:odyssey;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=TYPE,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.jwt.secret=test-secret-key-for-automated-tests-only-0123456789abcdef
app.jwt.access-expiration=900000
app.jwt.refresh-expiration=604800000
app.jwt.remember-me-refresh-expiration=2592000000
app.jwt.issuer=odyssey
app.jwt.audience=odyssey-web
app.jwt.secure-cookies=false
app.cors.allowed-origins=http://localhost:3000
app.frontend-url=http://localhost:3000
app.mail.mode=log
app.mail.from=no-reply@odyssey.local
app.rate-limit.enabled=false
file.upload-dir=target/test-uploads
