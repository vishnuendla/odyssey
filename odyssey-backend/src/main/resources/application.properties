# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/odyssey_db?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=false

# Schema migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JWT / sessions
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.jwt.remember-me-refresh-expiration=${JWT_REMEMBER_REFRESH_EXPIRATION:2592000000}
app.jwt.issuer=${JWT_ISSUER:odyssey}
app.jwt.audience=${JWT_AUDIENCE:odyssey-web}
app.jwt.secure-cookies=${COOKIE_SECURE:false}

# CORS / links
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Geocoding. The Geoapify key stays on the server; the browser only talks to
# /api/locations/** so the key never ships in the JavaScript bundle.
app.geoapify.api-key=${GEOAPIFY_API_KEY:}
app.geoapify.base-url=${GEOAPIFY_BASE_URL:https://api.geoapify.com}

# Email. MAIL_MODE=log prints verification/reset links to the log instead of
# sending them, so local development needs no SMTP server.
app.mail.mode=${MAIL_MODE:log}
app.mail.from=${MAIL_FROM:no-reply@odyssey.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Authentication rate limits (in-memory, per client IP)
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# File upload settings. Mirrored by nginx client_max_body_size and the frontend.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Server
server.port=9090

# Observability
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics}
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true
# MAIL_MODE=log does not use SMTP, so do not fail readiness when no mail server is running.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
management.info.env.enabled=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.odyssey=INFO
